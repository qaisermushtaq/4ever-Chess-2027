<body>

    <!-- Pawn Promotion Modal -->

                <button data-promo="r" class="promo-btn m3-btn rounded-2xl bg-neutral-800 hover:bg-amber-500/25 border border-amber-500/30 p-3 flex flex-col items-center">

                <button data-promo="b" class="promo-btn m3-btn rounded-2xl bg-neutral-800 hover:bg-amber-500/25 border border-amber-500/30 p-3 flex flex-col items-center">

    <!-- Bottom Controls Bar -->
    <nav class="fixed bottom-3 inset-x-0 z-20 flex justify-center px-3 pointer-events-none">
        <div class="glass-panel rounded-full px-3 py-1.5 pointer-events-auto flex items-center gap-1.5 sm:gap-2 overflow-x-auto max-w-full shadow-2xl">
            
            <!-- AI vs 2P Switch -->
            <div class="flex items-center bg-black/50 p-1 rounded-full border border-neutral-700/60">
                <button id="mode-ai-btn" class="m3-btn px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 bg-amber-400 text-neutral-950 transition">
                    <span class="material-symbols-outlined text-base">smart_toy</span>

                <button id="mode-2p-btn" class="m3-btn px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1 text-neutral-300 hover:text-white transition">

            <div class="h-5 w-[1px] bg-neutral-700 mx-1"></div>

            <!-- Camera Angles -->

            <button data-cam="black" class="cam-btn m3-btn px-2.5 py-1.5 rounded-full text-xs font-medium text-neutral-300 hover:bg-white/10">Black View</button>
            <button data-cam="top" class="cam-btn m3-btn px-2.5 py-1.5 rounded-full text-xs font-medium text-neutral-300 hover:bg-white/10">Top View</button>
            <button data-cam="cinematic" class="cam-btn m3-btn px-2.5 py-1.5 rounded-full text-xs font-medium text-neutral-300 hover:bg-white/10">Cinematic</button>

            <div class="h-5 w-[1px] bg-neutral-700 mx-1"></div>

            <!-- Actions -->

                <span class="material-symbols-outlined text-base">undo</span>
                <span>Undo</span>
            </button>
            <button id="reset-btn" class="m3-btn px-2.5 py-1.5 rounded-full text-xs font-medium text-neutral-200 hover:bg-white/10 flex items-center gap-1">
                <span class="material-symbols-outlined text-base">restart_alt</span>
                <span>Reset</span>
            </button>
            <button id="sound-btn" class="m3-btn p-1.5 rounded-full text-amber-300 bg-amber-400/10 border border-amber-400/30">
                <span id="sound-icon" class="material-symbols-outlined text-base">volume_up</span>
            </button>
        </div>
    </nav>

    <script>
        /*************************************************************
         * 1. AUDIO SYNTHESIZER
         *************************************************************/
        class SfxEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type = 'sine', duration = 0.15, vol = 0.15) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + duration);
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.05);
            }
            selectPiece() { this.playTone(620, 'sine', 0.12, 0.12); }
            movePiece() { this.playTone(180, 'triangle', 0.18, 0.25); }
            capturePiece() { 
                this.playTone(400, 'sawtooth', 0.25, 0.3);
                setTimeout(() => this.playTone(120, 'sine', 0.35, 0.35), 40);
            }
            checkAlert() {
                this.playTone(440, 'sine', 0.2, 0.2);
                setTimeout(() => this.playTone(554.37, 'sine', 0.3, 0.25), 120);
            }
        }
        const sfx = new SfxEngine();

        /*************************************************************
         * 2. BALANCED THREE.JS SCENE SETUP
         *************************************************************/
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0d14);
        scene.fog = new THREE.FogExp2(0x0c0d14, 0.02);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 11, 13);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; // Correct exposure (no blinding light)
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.04;
        controls.minDistance = 4;
        controls.maxDistance = 24;
        controls.target.set(0, 0.3, 0);

        /*************************************************************
         * 3. BALANCED STUDIO LIGHTING
         *************************************************************/
        // Soft Ambient Light
        const ambLight = new THREE.AmbientLight(0xd5dbed, 0.7);
        scene.add(ambLight);

        // Directional Key Light
        const keyLight = new THREE.DirectionalLight(0xfff7ea, 1.1);
        keyLight.position.set(7, 16, 9);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0003;
        scene.add(keyLight);

        // Soft Side Fill Light
        const fillLight = new THREE.DirectionalLight(0x9cb4ff, 0.45);
        fillLight.position.set(-8, 12, -7);
        scene.add(fillLight);

        // Subtle Rim Light for Black Pieces
        const purpleRim = new THREE.PointLight(0xa855f7, 0.7, 20);
        purpleRim.position.set(0, 6, -8);
        scene.add(purpleRim);

        // Subtle Warm Rim Light for White Pieces
        const amberRim = new THREE.PointLight(0xf59e0b, 0.5, 20);
        amberRim.position.set(0, 6, 8);
        scene.add(amberRim);

        /*************************************************************
         * 4. HIGH-CONTRAST NON-GLARING MATERIALS
         *************************************************************/
        // White Pieces: Soft Matte Ivory with subtle sheen
        const whitePieceMat = new THREE.MeshStandardMaterial({
            color: 0xddd7cb,
            roughness: 0.38,
            metalness: 0.05
        });

        // Black Pieces: Deep Charcoal Slate
        const blackPieceMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a24,
            roughness: 0.32,
            metalness: 0.25
        });

        // Gold Trim
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xd4a044,
            metalness: 0.75,
            roughness: 0.3
        });

        // Board Tiles
        const lightTileMat = new THREE.MeshStandardMaterial({
            color: 0xcec8bc,
            roughness: 0.45,
            metalness: 0.02
        });

        const darkTileMat = new THREE.MeshStandardMaterial({
            color: 0x2a2b38,
            roughness: 0.38,
            metalness: 0.12
        });

        const borderMat = new THREE.MeshStandardMaterial({
            color: 0x151620,
            roughness: 0.6,
            metalness: 0.15
        });

        const highlightGreen = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.65 });
        const highlightYellow = new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.75 });
        const highlightRed = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.7 });

        /*************************************************************
         * 5. CHESSBOARD CREATION
         *************************************************************/
        const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.45, 9.6), borderMat);
        baseMesh.position.y = -0.24;
        baseMesh.receiveShadow = true;
        scene.add(baseMesh);

        const goldTrim = new THREE.Mesh(new THREE.BoxGeometry(9.7, 0.08, 9.7), goldMat);
        goldTrim.position.y = -0.16;
        scene.add(goldTrim);

        const tiles = {};
        const tileHighlights = [];
        const squareSize = 1.05;

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const isLight = (r + c) % 2 === 0;
                const file = String.fromCharCode(97 + c);
                const rank = (8 - r).toString();
                const sq = file + rank;

                const tile = new THREE.Mesh(
                    new THREE.BoxGeometry(squareSize, 0.12, squareSize),
                    isLight ? lightTileMat : darkTileMat
                );
                tile.position.set((c - 3.5) * squareSize, 0, (r - 3.5) * squareSize);
                tile.receiveShadow = true;
                tile.userData = { square: sq, isTile: true };
                scene.add(tile);
                tiles[sq] = tile;

                const hl = new THREE.Mesh(
                    new THREE.RingGeometry(0.18, 0.44, 28),
                    highlightGreen
                );
                hl.rotation.x = -Math.PI / 2;
                hl.position.set(tile.position.x, 0.065, tile.position.z);
                hl.visible = false;
                hl.userData = { square: sq };
                scene.add(hl);
                tileHighlights.push(hl);
            }
        }

        /*************************************************************
         * 6. DETAILED 3D PIECES
         *************************************************************/
        function build3DPiece(type, color) {
            const grp = new THREE.Group();
            const mat = color === 'w' ? whitePieceMat : blackPieceMat;
            const accent = goldMat;

            // Pedestal
            const base1 = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 0.12, 24), mat);
            const base2 = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.1, 24), mat);
            base2.position.y = 0.1;
            const goldRing = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.025, 12, 32), accent);
            goldRing.rotation.x = Math.PI / 2;
            goldRing.position.y = 0.12;
            grp.add(base1, base2, goldRing);

            if (type === 'p') {
                const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.4, 20), mat);
                waist.position.y = 0.32;
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), mat);
                head.position.y = 0.62;
                grp.add(waist, head);
            } 
            else if (type === 'r') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.62, 20), mat);
                body.position.y = 0.42;
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.28, 0.22, 16), mat);
                crown.position.y = 0.76;
                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.03, 12, 24), accent);
                rim.rotation.x = Math.PI / 2;
                rim.position.y = 0.68;
                grp.add(body, crown, rim);
            } 
            else if (type === 'n') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.32, 0.45, 20), mat);
                body.position.y = 0.32;
                
                const horse = new THREE.Group();
                const snout = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.34, 0.44), mat);
                snout.position.set(0, 0.62, 0.08);
                snout.rotation.x = 0.42;

                const mane = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.24), accent);
                mane.position.set(0, 0.68, -0.12);
                mane.rotation.x = -0.25;

                const earL = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
                earL.position.set(0.09, 0.88, -0.02);
                const earR = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
                earR.position.set(-0.09, 0.88, -0.02);

                horse.add(snout, mane, earL, earR);
                if (color === 'b') horse.rotation.y = Math.PI;
                grp.add(body, horse);
            } 
            else if (type === 'b') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.65, 20), mat);
                body.position.y = 0.45;
                const miter = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 20), mat);
                miter.scale.set(0.85, 1.35, 0.85);
                miter.position.y = 0.82;
                const crossFinial = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), accent);
                crossFinial.position.y = 1.15;
                grp.add(body, miter, crossFinial);
            } 
            else if (type === 'q') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.32, 0.85, 20), mat);
                body.position.y = 0.55;
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.22, 0.32, 18), mat);
                crown.position.y = 1.0;
                const orb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 20), accent);
                orb.position.y = 1.22;
                grp.add(body, crown, orb);
            } 
            else if (type === 'k') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.34, 0.92, 20), mat);
                body.position.y = 0.58;
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.28, 0.28, 18), mat);
                crown.position.y = 1.08;
                
                const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), accent);
                crossV.position.y = 1.35;
                const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.08), accent);
                crossH.position.y = 1.38;
                grp.add(body, crown, crossV, crossH);
            }

            grp.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            return grp;
        }

        /*************************************************************
         * 7. ENGINE & LOGIC
         *************************************************************/
        const chess = new Chess();
        let pieceMeshes = {};
        let activeSelectedSquare = null;
        let availableMoves = [];
        let isAiMode = true;
        let isBusyAnimating = false;
        let promotionCandidate = null;

        function getCoords(sq) {
            const c = sq.charCodeAt(0) - 97;
            const r = 8 - parseInt(sq[1], 10);
            return {
                x: (c - 3.5) * squareSize,
                z: (r - 3.5) * squareSize
            };
        }

        function refreshBoardView() {
            Object.values(pieceMeshes).forEach(m => scene.remove(m));
            pieceMeshes = {};

            const board = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const sq = String.fromCharCode(97 + c) + (8 - r);
                        const mesh = build3DPiece(piece.type, piece.color);
                        const coords = getCoords(sq);
                        mesh.position.set(coords.x, 0.06, coords.z);
                        mesh.userData = { square: sq, piece: piece };
                        scene.add(mesh);
                        pieceMeshes[sq] = mesh;
                    }
                }
            }
            updateHUDStatus();
        }

        function resetAllHighlights() {
            tileHighlights.forEach(h => {
                h.visible = false;
                h.material = highlightGreen;
            });
        }

        function highlightSquaresFor(sq) {
            resetAllHighlights();
            availableMoves = chess.moves({ square: sq, verbose: true });

            const originHL = tileHighlights.find(h => h.userData.square === sq);
            if (originHL) {
                originHL.material = highlightYellow;
                originHL.visible = true;
            }

            availableMoves.forEach(m => {
                const destHL = tileHighlights.find(h => h.userData.square === m.to);
                if (destHL) {
                    destHL.material = m.captured ? highlightRed : highlightGreen;
                    destHL.visible = true;
                }
            });
        }

        function makeMoveAnimation(moveData, onDone) {
            const fromSq = moveData.from;
            const toSq = moveData.to;
            const movingPiece = pieceMeshes[fromSq];
            if (!movingPiece) return;

            isBusyAnimating = true;
            const target = getCoords(toSq);
            const captured = pieceMeshes[toSq];

            if (moveData.captured) sfx.capturePiece();
            else sfx.movePiece();

            const startX = movingPiece.position.x;
            const startZ = movingPiece.position.z;
            const startTime = performance.now();
            const duration = 260;

            function step(time) {
                const elapsed = time - startTime;
                const p = Math.min(elapsed / duration, 1);
                const ease = 0.5 - Math.cos(p * Math.PI) / 2;

                movingPiece.position.x = startX + (target.x - startX) * ease;
                movingPiece.position.z = startZ + (target.z - startZ) * ease;
                movingPiece.position.y = 0.06 + Math.sin(p * Math.PI) * 0.55;

                if (p < 1) {
                    requestAnimationFrame(step);
                } else {
                    movingPiece.position.set(target.x, 0.06, target.z);
                    movingPiece.userData.square = toSq;

                    if (captured) scene.remove(captured);

                    chess.move(moveData);
                    delete pieceMeshes[fromSq];
                    pieceMeshes[toSq] = movingPiece;

                    if (moveData.flags.includes('k') || moveData.flags.includes('q') || moveData.flags.includes('e') || moveData.promotion) {
                        refreshBoardView();
                    }

                    isBusyAnimating = false;
                    resetAllHighlights();
                    activeSelectedSquare = null;
                    updateHUDStatus();

                    if (onDone) onDone();
                    evaluateAiTurn();
                }
            }
            requestAnimationFrame(step);
        }

        function triggerAi() {
            if (chess.game_over()) return;
            const moves = chess.moves({ verbose: true });
            if (moves.length === 0) return;

            const captures = moves.filter(m => m.captured);
            let move = null;
            if (captures.length > 0 && Math.random() > 0.3) {
                move = captures[Math.floor(Math.random() * captures.length)];
            } else {
                move = moves[Math.floor(Math.random() * moves.length)];
            }

            if (move.promotion) move.promotion = 'q';

            setTimeout(() => {
                makeMoveAnimation(move);
            }, 350);
        }

        function evaluateAiTurn() {
            if (isAiMode && chess.turn() === 'b' && !chess.game_over()) {
                document.getElementById('turn-text').textContent = "AI is thinking...";
                triggerAi();
            }
        }

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function onPointerTap(e) {
            if (isBusyAnimating || (isAiMode && chess.turn() === 'b')) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            for (let hit of hits) {
                let obj = hit.object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }

                const sq = obj.userData.square;
                if (!sq) continue;

                if (activeSelectedSquare) {
                    const foundMove = availableMoves.find(m => m.to === sq);
                    if (foundMove) {
                        if (foundMove.flags.includes('p') || (foundMove.piece === 'p' && (sq[1] === '8' || sq[1] === '1'))) {
                            promotionCandidate = foundMove;
                            document.getElementById('promotion-modal').classList.remove('hidden');
                            document.getElementById('promotion-modal').classList.add('flex');
                            return;
                        }
                        makeMoveAnimation(foundMove);
                        return;
                    }
                }

                const piece = chess.get(sq);
                if (piece && piece.color === chess.turn()) {
                    activeSelectedSquare = sq;
                    sfx.selectPiece();
                    highlightSquaresFor(sq);
                    return;
                }

                activeSelectedSquare = null;
                resetAllHighlights();
                break;
            }
        }

        window.addEventListener('pointerdown', onPointerTap);

        document.querySelectorAll('.promo-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const choice = btn.dataset.promo;
                document.getElementById('promotion-modal').classList.add('hidden');
                document.getElementById('promotion-modal').classList.remove('flex');
                if (promotionCandidate) {
                    promotionCandidate.promotion = choice;
                    makeMoveAnimation(promotionCandidate);
                    promotionCandidate = null;
                }
            });
        });

        function updateHUDStatus() {
            const turn = chess.turn();
            const turnText = document.getElementById('turn-text');
            const turnOrb = document.getElementById('turn-orb');
            const checkBadge = document.getElementById('check-badge');

            if (turn === 'w') {
                turnOrb.className = "w-3.5 h-3.5 rounded-full bg-amber-300 shadow-[0_0_12px_#ffd599]";
                turnText.textContent = "White's Turn (Marble)";
            } else {
                turnOrb.className = "w-3.5 h-3.5 rounded-full bg-purple-400 shadow-[0_0_12px_#c084fc]";
                turnText.textContent = isAiMode ? "AI's Turn (Obsidian)" : "Black's Turn (Obsidian)";
            }

            if (chess.in_check()) {
                checkBadge.classList.remove('hidden');
                sfx.checkAlert();
            } else {
                checkBadge.classList.add('hidden');
            }

            let wCount = 16, bCount = 16;
            chess.board().forEach(r => r.forEach(p => {
                if (p) {
                    if (p.color === 'w') wCount--;
                    if (p.color === 'b') bCount--;
                }
            }));
            document.getElementById('captured-white').textContent = wCount;
            document.getElementById('captured-black').textContent = bCount;

            const history = chess.history();
            const logEl = document.getElementById('move-history');
            if (history.length > 0) {
                logEl.innerHTML = history.slice(-5).map(m => `<span class="px-1.5 py-0.5 rounded bg-white/10 text-amber-200 font-bold">${m}</span>`).join('');
            }

            if (chess.game_over()) {
                const modal = document.getElementById('gameover-modal');
                const title = document.getElementById('gameover-title');
                const desc = document.getElementById('gameover-desc');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                if (chess.in_checkmate()) {
                    title.textContent = "CHECKMATE!";
                    desc.textContent = (chess.turn() === 'w' ? "Black (Obsidian)" : "White (Marble)") + " wins the game!";
                } else {
                    title.textContent = "STALEMATE / DRAW";
                    desc.textContent = "The match ended in a draw.";
                }
            }
        }

        function switchCam(mode) {
            const targetPos = new THREE.Vector3();
            if (mode === 'white') targetPos.set(0, 11, 13);
            else if (mode === 'black') targetPos.set(0, 11, -13);
            else if (mode === 'top') targetPos.set(0, 16.5, 0.01);
            else if (mode === 'cinematic') targetPos.set(11, 8.5, 11);

            const startPos = camera.position.clone();
            const startT = performance.now();
            function tween(now) {
                const progress = Math.min((now - startT) / 500, 1);
                const ease = 0.5 - Math.cos(progress * Math.PI) / 2;
                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.set(0, 0.3, 0);
                if (progress < 1) requestAnimationFrame(tween);
            }
            requestAnimationFrame(tween);
        }

        document.querySelectorAll('.cam-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cam-btn').forEach(b => {
                    b.classList.remove('text-amber-300', 'bg-amber-400/20', 'border', 'border-amber-400/40');
                    b.classList.add('text-neutral-300');
                });
                btn.classList.add('text-amber-300', 'bg-amber-400/20', 'border', 'border-amber-400/40');
                btn.classList.remove('text-neutral-300');
                switchCam(btn.dataset.cam);
            });
        });

        document.getElementById('mode-ai-btn').addEventListener('click', function () {
            isAiMode = true;
            this.classList.add('bg-amber-400', 'text-neutral-950');
            this.classList.remove('text-neutral-300');
            const p2 = document.getElementById('mode-2p-btn');
            p2.classList.remove('bg-amber-400', 'text-neutral-950');
            p2.classList.add('text-neutral-300');
            evaluateAiTurn();
        });

        document.getElementById('mode-2p-btn').addEventListener('click', function () {
            isAiMode = false;
            this.classList.add('bg-amber-400', 'text-neutral-950');
            this.classList.remove('text-neutral-300');
            const ai = document.getElementById('mode-ai-btn');
            ai.classList.remove('bg-amber-400', 'text-neutral-950');
            ai.classList.add('text-neutral-300');
        });

        function resetGame() {
            chess.reset();
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.remove('flex');
            refreshBoardView();
        }
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        document.getElementById('gameover-reset-btn').addEventListener('click', resetGame);

        document.getElementById('undo-btn').addEventListener('click', () => {
            if (isBusyAnimating) return;
            chess.undo();
            if (isAiMode) chess.undo();
            refreshBoardView();
        });

        document.getElementById('sound-btn').addEventListener('click', function () {
            sfx.enabled = !sfx.enabled;
            document.getElementById('sound-icon').textContent = sfx.enabled ? 'volume_up' : 'volume_off';
            this.classList.toggle('opacity-50', !sfx.enabled);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        refreshBoardView();
        animate();
    </script>
</body>
</html>
